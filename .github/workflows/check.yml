name: Check

on:
  workflow_dispatch:
  push:
    paths:
      - 'CHANGELOG.md'
      - '.aspell.*.pws'

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: DavidAnson/markdownlint-cli2-action@v9
        with:
          globs: 'CHANGELOG.md'
      - name: Check code fences with rumdl
        run: |
          npm install -g rumdl@0.3.0
          rumdl check --no-config --no-cache --enable MD046,MD070 CHANGELOG.md
  spellchecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup aspell
        run: sudo apt-get -y update && sudo apt-get -y install aspell aspell-en
      - name: Run spellchecker
        run: |
          SPELLCHECK_OUT=$(cat CHANGELOG.md \
            | aspell --lang=en --encoding=utf-8 --personal=./.aspell.en.pws list)
          echo $SPELLCHECK_OUT
          test $(echo -n $SPELLCHECK_OUT | wc -c) -eq 0
